    const MEMORY = {};
    function loadState(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        if (v) return JSON.parse(v);
      } catch(err) {
        MEMORY[`_err_${key}`] = err.message;
      }
      return MEMORY[key] ?? fallback;
    }
    function saveState(key, value) {
      MEMORY[key] = value;
      try { localStorage.setItem(key, JSON.stringify(value)); } catch(err) {
        // Surface failures so Settings can warn the user (quota exceeded, Safari Private, etc.)
        MEMORY[`_err_${key}`] = err.message;

    // Cascade: context-specific → emotion+tier+time → emotion+tier → emotion → fallback
    function getBehaviouralResponse(emotion, intensity, ts, contexts, variantSeed) {
      const key   = getTechniqueEmotionKey(emotion);
      const tier  = intensity <= 2 ? "low" : intensity <= 3 ? "mid" : "high";
      const h     = new Date(ts).getHours();
      const period = h >= 5 && h < 12 ? "morning" : h >= 12 && h < 17 ? "afternoon" : h >= 17 && h < 22 ? "evening" : "night";
      const vi    = variantSeed % 2;
      const CONTEXT_KEYS = ["Work","Meeting","Family","Exercise","Rest"];
      const matchedCtx = (contexts || []).find(c => CONTEXT_KEYS.includes(c));
      const cascade = [
        matchedCtx ? `${key}_${tier}_${matchedCtx.toLowerCase()}` : null,
        `${key}_${tier}_${period}`,
        `${key}_${tier}`,
        key,
        "fallback",
      ].filter(Boolean);
      for (const k of cascade) {
        const opts = RESPONSE_LIBRARY[k];
        if (opts && opts.length) return opts[vi % opts.length];
      }
      return RESPONSE_LIBRARY.fallback[0];
    }

    // P3T6 CHANGE: streak is now derived from committed entries instead of detached state.
    function computeStreak(entries, referenceTs = Date.now()) {

      let count = 0;
      while (dayKeys.includes(cursor.toDateString())) {
        count += 1;
        cursor.setDate(cursor.getDate() - 1);
      }
      return { count, lastDay: dayKeys[0] ?? null };
    }

    // ========================================== //
    //  ANALYTICS: Insights + Nudges
    // ========================================== //

    function buildInsights(entries, emotionMap) {
      const recentEntries = getRecentEntries(entries, 30);
      if (recentEntries.length < 2) return [];
      const insights = [];
      const heavyIds = new Set(["anger","anxiety"]);
      const calmIds  = new Set(["calm","deep-calm","positive"]);

      const lateWork = recentEntries.filter(e => {
        const h = new Date(e.ts).getHours();
        const ctx = e.contexts || [];
        return h>=17 && (e.place==="Work"||ctx.includes("Study")||ctx.includes("Meeting"));
      });
      if (lateWork.length>=2 && lateWork.filter(e=>entryMatchesTracking(e, heavyIds, emotionMap)).length>=2)
        insights.push({ id:"late-work-heavy", title:"Late work hours feel heavier", body:"Stress shows up more often after work runs late. That pattern looks consistent enough to protect your end-of-day transition.", accent: emotionMap.anxiety?.color??"#FF9F43" });

      const outside = recentEntries.filter(e=>e.place==="Outside");
      if (outside.length>=2 && outside.filter(e=>entryMatchesTracking(e, calmIds, emotionMap)).length/outside.length>=0.6)
        insights.push({ id:"outside-restorative", title:"Outside time looks restorative", body:"Check-ins logged outside tend to land calmer or lighter. That shift feels worth keeping in the routine.", accent: emotionMap.calm?.color??"#6BCB77" });

      const byPlace = {};
      recentEntries.forEach(e=>{ if(!e.place)return; byPlace[e.place]=byPlace[e.place]||{}; byPlace[e.place][e.emotionId]=(byPlace[e.place][e.emotionId]||0)+1; });
      Object.entries(byPlace).some(([place,counts])=>{
        const total = Object.values(counts).reduce((s,c)=>s+c,0);
        if(total<2)return false;
        const [eid,count] = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
        if(count/total<0.6)return false;
        const em = emotionMap[eid]; if(!em)return false;
        insights.push({ id:`place-tone-${place.toLowerCase()}`, title:`${place} has a clear tone`, body:`${place} entries usually trend toward ${em.label.toLowerCase()}. Reload can start to trust that pattern.`, accent:em.color });
        return true;
      });

      const evening = recentEntries.filter(e=>new Date(e.ts).getHours()>=19);
      if (evening.length>=2 && evening.filter(e=>entryMatchesTracking(e, calmIds, emotionMap)).length/evening.length>=0.65)
        insights.push({ id:"evenings-settle", title:"Evenings settle well", body:"Your later check-ins often soften by the end of the day. That wind-down seems to be doing its job.", accent: emotionMap["deep-calm"]?.color??"#4D96FF" });

      return insights.slice(0,3);
    }

    // P3T6 CHANGE: smart nudges are now session-aware, time-windowed, and cooldown-gated.
    function buildSmartNudge(entries, emotionMap, lastNudgeDismissedAt = null, now = Date.now()) {
      const COOLDOWN_MS = 45 * 60 * 1000;
      const SESSION_WINDOW_MS = 2 * 60 * 60 * 1000;
      if (lastNudgeDismissedAt && now - lastNudgeDismissedAt < COOLDOWN_MS) return null;
      const sessionEntries = entries.filter(entry => now - entry.ts <= SESSION_WINDOW_MS).sort((a,b)=>a.ts-b.ts);
      if (sessionEntries.length < 2) return null;
      const heavyIds = new Set(["anger","anxiety"]);
      const calmIds  = new Set(["calm","deep-calm","positive"]);

      if (sessionEntries.filter(e=>entryMatchesTracking(e, heavyIds, emotionMap)).length >= 3)
        return { id:"session-heavy", title:"A heavy stretch is building", body:"You’ve logged three tense moments in the last couple of hours. A short pause now could help soften the next one.", accent: emotionMap.anxiety?.color??"#FF9F43" };

      const restorativeEntries = sessionEntries.filter(e=>(e.place==="Outside" || e.place==="Nature") && entryMatchesTracking(e, calmIds, emotionMap));
      if (restorativeEntries.length >= 2)
        return { id:"session-restorative", title:"Hold onto what is helping", body:"Your recent outside moments are landing lighter. If you can, give yourself a little more of that same setting.", accent: emotionMap.calm?.color??"#6BCB77" };

      const latest = sessionEntries[sessionEntries.length-1];
      if (latest&&latest.place==="Work"&&entryMatchesTracking(latest, new Set(["anger","anxiety","neutral"]), emotionMap)&&new Date(latest.ts).getHours()>=17)
        return { id:"session-work-loop", title:"Time to close the work loop", body:"Work still seems to be sitting with you. A short reset after you step away could help the evening feel more separate.", accent: emotionMap["deep-calm"]?.color??"#4D96FF" };
      return null;
    }

    function getWeeklySummary(entries, emotionMap) {
      return getSummaryForDates(entries, emotionMap, getWeekDates());
    }

    // P3T7 CHANGE: the rolling monthly summary and insights now share the same 30-day bound.
    function getMonthlySummary(entries, emotionMap) {
      return getSummaryForDates(getRecentEntries(entries, 30), emotionMap, getPastDates(30));
    }
    function getCalendarMonthSummary(entries, emotionMap, monthDate) {
      return getSummaryForDates(entries, emotionMap, getMonthDates(monthDate));
    }

    function ConfirmDialog({ title, body, confirmLabel="Confirm", onConfirm, onCancel }) {
      const dialogRef = useRef(null);
      useEffect(()=>{
        const el = dialogRef.current; if (!el) return;
        // Intentionally focus Cancel first. Pressing Enter on a destructive prompt should
        // dismiss safely, not confirm. Accessibility audits may flag this — it is deliberate.
        const first = el.querySelector("button"); if (first) first.focus();
        function onKey(e){ if(e.key==="Escape") onCancel(); }
        document.addEventListener("keydown", onKey);
        return ()=>document.removeEventListener("keydown", onKey);
      },[onCancel]);
      return (
        <div onClick={onCancel} style={{ position:"fixed", inset:0, zIndex:60, background:"rgba(15,23,42,0.35)", backdropFilter:"blur(18px)", WebkitBackdropFilter:"blur(18px)", display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>

    function TechniquePrompt({ emotionId, goalId, promptSeed, savedTechniques, onToggleSave, onOpenHub, onDismiss }) {
      const emotionMap = useEmotionMap();
      const [expanded, setExpanded] = useState(false);
      const emotion = emotionId ? emotionMap[emotionId] : null;
      const techs = getTechniquesForEmotion(emotionId, emotionMap);
      const techIndex = techs.length ? hashString(`${emotionId}-${promptSeed || "default"}`) % techs.length : 0;
      const tech  = techs[techIndex];
      if (!tech) return null;
      const accent = emotion?.color || "#4D96FF";

    function GoalCard({ goal, entries, reminders, onEdit, onOpenTechniques, onOpenReminders }) {
      const emotionMap = useEmotionMap();
      const goalOption = GOAL_OPTIONS.find(g=>g.id===goal?.id);

      if (!goal || !goalOption) {
        return (
          <SectionCard style={{ padding:22 }}>
            <div style={{ fontSize:12, color:"#7A869A", fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:8 }}>Your direction</div>
            <div style={{ fontSize:20, fontWeight:700, color:"#0F1728", letterSpacing:"-0.04em", marginBottom:10 }}>No direction set yet</div>

      const suggestedTech = uniqueTechs[0];
      const upcomingReminders = [...reminders]
        .filter(reminder => !reminder.deliveredAt && reminder.scheduledFor > Date.now())
        .sort((a, b) => a.scheduledFor - b.scheduledFor);

      return (
        <SectionCard style={{ padding:22 }}>
          <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, marginBottom:16 }}>
            <div>

                <div style={{ width:8, height:8, borderRadius:"50%", background:goalOption.color, flexShrink:0 }} />

              <div style={{ height:6, borderRadius:999, background:"rgba(220,227,237,0.7)", overflow:"hidden" }}>
                <div style={{ height:"100%", width:`${pct}%`, borderRadius:999, background:`linear-gradient(90deg,${goalOption.color}99,${goalOption.color})`, transition:"width 600ms ease" }} />
              </div>
              <div style={{ fontSize:12, color:"#67758A", marginTop:8 }}>{matching} of {total} check-in{total!==1?"s":""} heading your way</div>

          {suggestedTech && (
            <button onClick={onOpenTechniques} style={{ width:"100%", border:"none", borderRadius:18, padding:"14px 16px", minHeight:44, marginBottom:16, background:"rgba(248,250,253,0.92)", boxShadow:"inset 0 0 0 1px rgba(220,227,237,0.66)", cursor:"pointer", textAlign:"left", display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>
              <div>
                <div style={{ fontSize:11, color:"#7A869A", fontWeight:700, letterSpacing:"0.06em", marginBottom:2 }}>TRY THIS</div>
                <div style={{ fontSize:14, fontWeight:700, color:"#0F1728" }}>{suggestedTech.title}</div>
                <div style={{ fontSize:12, color:"#67758A" }}>{suggestedTech.purpose}</div>

              <div style={{ fontSize:18, color:"#C8D0DC", flexShrink:0 }}>›</div>

            {upcomingReminders.length ? (

                {upcomingReminders.slice(0, 3).map(reminder=>(
                  <div key={reminder.id} style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, padding:"12px 14px", borderRadius:18, background:"rgba(248,250,253,0.92)", boxShadow:"inset 0 0 0 1px rgba(220,227,237,0.66)" }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13, fontWeight:700, color:"#0F1728", marginBottom:4 }}>{reminder.label}</div>
                      <div style={{ fontSize:12, color:"#67758A", marginBottom:6 }}>{formatReminderDateTime(reminder.scheduledFor)}</div>

                    </div>
                    <div style={{ padding:"5px 9px", borderRadius:999, background:"rgba(244,247,251,0.92)", color:"#627085", fontSize:10, fontWeight:700, letterSpacing:"0.04em", textTransform:"uppercase", flexShrink:0 }}>Scheduled</div>

              </div>
            ) : (
              <div style={{ padding:"14px 16px", borderRadius:18, background:"rgba(248,250,253,0.92)", boxShadow:"inset 0 0 0 1px rgba(220,227,237,0.66)" }}>
                <p style={{ margin:0, fontSize:13, fontWeight:700, color:"#243043" }}>No reminders set yet</p>
                <p style={{ margin:"6px 0 0", fontSize:12, color:"#67758A", lineHeight:1.6 }}>{REMINDER_SCOPE_COPY}</p>
              </div>
            )}
          </div>
        </SectionCard>
      );
    }

    function ReminderFormSheet({ goalOption, initialReminder=null, onSave, onClose }) {
      const isEditing = Boolean(initialReminder);
      const [label, setLabel] = useState(initialReminder?.label || "");
      const [message, setMessage] = useState(initialReminder?.message || "");
      const [dateValue, setDateValue] = useState(initialReminder ? formatDateInputValue(initialReminder.scheduledFor) : "");
      const [timeValue, setTimeValue] = useState(initialReminder ? formatTimeInputValue(initialReminder.scheduledFor) : "");

      useEffect(()=>{
        function onKey(e){ if(e.key==="Escape") onClose(); }
        document.addEventListener("keydown", onKey);
        return ()=>document.removeEventListener("keydown", onKey);
      },[onClose]);

      const scheduledFor = combineDateAndTime(dateValue, timeValue);
      const isPast = scheduledFor !== null && scheduledFor <= Date.now();
      const canSave = label.trim() && dateValue && timeValue && scheduledFor !== null && !isPast;

      function handleSave() {
        if (!canSave) return;
        onSave({
          id: initialReminder?.id || createId("reminder"),
          goalId: goalOption.id,
          label: label.trim(),
          message: message.trim() || "A gentle pause might help you notice what is going on right now.",
          scheduledFor,
          deliveredAt: null,
          createdAt: initialReminder?.createdAt || Date.now(),
          updatedAt: Date.now(),
        });
      }

      return (
        <div onClick={onClose} style={{ position:"fixed", inset:0, zIndex:43, background:"rgba(15,23,42,0.28)", backdropFilter:"blur(18px)", WebkitBackdropFilter:"blur(18px)", display:"flex", alignItems:"flex-end", justifyContent:"center", padding:16 }}>
          <div onClick={e=>e.stopPropagation()} role="dialog" aria-modal="true" aria-labelledby="reminder-form-title" style={{ width:"100%", maxWidth:460, borderRadius:30, background:"rgba(255,255,255,0.97)", border:"1px solid rgba(255,255,255,0.9)", boxShadow:"0 28px 90px rgba(15,23,42,0.18)", padding:24, animation:"reload-rise 220ms ease both" }}>
            <div style={{ width:42, height:5, borderRadius:999, background:"#D7DEE8", margin:"0 auto 20px" }} />
            <h3 id="reminder-form-title" style={{ margin:"0 0 4px", fontSize:22, fontWeight:700, color:"#0F1728", letterSpacing:"-0.04em" }}>{isEditing ? "Edit reminder" : "Add reminder"}</h3>

              </div>
              <div>
                <label htmlFor="reminder-message" style={{ display:"block", fontSize:13, fontWeight:700, color:"#435065", marginBottom:8 }}>Reminder note</label>

    // P3T3 CHANGE: custom emotion flow now supports editing, category + energy fields, and a spectrum color picker.
    function CustomEmotionForm({ onSave, onClose, initialEmotion=null }) {
      const [name, setName] = useState(initialEmotion?.label || "");
      const [categoryId, setCategoryId] = useState(initialEmotion?.categoryId || "");
      const [energyLevel, setEnergyLevel] = useState(initialEmotion?.energyLevel || "");
      const [hexColor, setHexColor] = useState(initialEmotion?.color || "#4D96FF");
      const sheetRef = useRef(null);
      const isEditing = Boolean(initialEmotion);
      const selectedCategory = categoryId ? CUSTOM_CATEGORY_MAP[categoryId] : null;
      const previewEmotion = name.trim() && selectedCategory && energyLevel
        ? buildCustomEmotionRecord({
            id: initialEmotion?.id,
            label: name,
            color: hexColor,
            categoryId,
            energyLevel,
            archived: initialEmotion?.archived,
          })
        : null;

      useEffect(()=>{
        function onKey(e){ if(e.key==="Escape") onClose(); }
        document.addEventListener("keydown", onKey);
        return ()=>document.removeEventListener("keydown", onKey);
      },[onClose]);

      function handleSave() {
        const trimmed = name.trim();
        if (!trimmed || !categoryId || !energyLevel) return;
        onSave(buildCustomEmotionRecord({
          id: initialEmotion?.id,
          label: trimmed,
          color: hexColor,
          categoryId,
          energyLevel,
          archived: initialEmotion?.archived,
        }));

        <div onClick={onClose} style={{ position:"fixed", inset:0, zIndex:42, background:"rgba(15,23,42,0.28)", backdropFilter:"blur(18px)", WebkitBackdropFilter:"blur(18px)", display:"flex", alignItems:"flex-end", justifyContent:"center", padding:16 }}>

            <div style={{ width:42, height:5, borderRadius:999, background:"#D7DEE8", margin:"0 auto 20px" }} />
            <h3 id="custom-emotion-title" style={{ margin:"0 0 4px", fontSize:22, color:"#0F1728", letterSpacing:"-0.04em" }}>{isEditing ? "Edit your feeling" : "Name your feeling"}</h3>
            <p style={{ margin:"0 0 20px", fontSize:13, color:"#5B6678", lineHeight:1.5 }}>{isEditing ? "Tweak the name, colour, or mood shape whenever it needs to feel more true to you." : "Give it a name that feels right. A little structure helps Reload understand it more gently."}</p>

            <div style={{ display:"grid", gap:16 }}>
              <div>
                <input autoFocus type="text" maxLength={20} value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSave()} placeholder="e.g. Overwhelmed, Grateful…" style={{ width:"100%", border:"none", borderRadius:18, padding:"14px 16px", fontSize:15, fontWeight:600, background:"#F4F7FB", color:"#0F1728", outline:"none", boxShadow:"inset 0 0 0 1px rgba(200,210,225,0.7)" }} />
              </div>

              <div>
                <p style={{ margin:"0 0 10px", fontSize:12, fontWeight:700, color:"#7A869A", letterSpacing:"0.06em" }}>DOES THIS FEEL MORE LIKE:</p>
                <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                  {CUSTOM_CATEGORY_OPTIONS.map(option=>(
                    <TagPill key={option.id} label={option.label} active={categoryId===option.id} accent="rgba(77,150,255,0.14)" onClick={()=>setCategoryId(option.id)} />
                  ))}
                </div>
              </div>

              <div>
                <p style={{ margin:"0 0 10px", fontSize:12, fontWeight:700, color:"#7A869A", letterSpacing:"0.06em" }}>ENERGY LEVEL</p>
                <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                  {CUSTOM_ENERGY_OPTIONS.map(option=>(
                    <TagPill key={option} label={option} active={energyLevel===option} accent="rgba(255,209,102,0.18)" onClick={()=>setEnergyLevel(option)} />
                  ))}
                </div>
              </div>

                  </div>
                </div>
              </div>
            </div>

            {previewEmotion && (
              <div style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 14px", borderRadius:18, background:previewEmotion.tint, margin:"18px 0 0" }}>
                <Flame emotion={previewEmotion} intensity={energyLevel==="High"?5:energyLevel==="Low"?2:3} size={22} />
                <div style={{ minWidth:0 }}>
                  <div style={{ fontSize:14, fontWeight:700, color:"#0F1728", marginBottom:2 }}>{previewEmotion.label}</div>
                  <div style={{ fontSize:12, color:"#67758A", lineHeight:1.4 }}>{selectedCategory?.label} · {energyLevel} energy</div>

          </div>
        </div>
      );

    function App() {

        return (Array.isArray(stored) ? stored : []).map(normalizeCustomEmotionRecord).filter(Boolean);
      });
      const [customContexts,     setCustomContexts]     = useState(()=>{
        const stored = loadState("reload_v2_custom_contexts",[]);
        return (Array.isArray(stored) ? stored : []).map(item=>({
          id:item.id || createId("context"),
          label:(item.label || "").trim(),
          archived:Boolean(item.archived),
        })).filter(item=>item.label);
      });
      const [moodGoal,           setMoodGoal]           = useState(()=>loadState("reload_v2_goal",null));
      const [reminders,          setReminders]          = useState(()=>{
        const stored = loadState("reload_v2_reminders", []);
        return (Array.isArray(stored) ? stored : []).map(normalizeReminderRecord).filter(Boolean);
      });
      const [savedTechniques,    setSavedTechniques]    = useState(()=>loadState("reload_v2_saved_techs",[]));
      const [techniquesEnabled,  setTechniquesEnabled]  = useState(()=>loadState("reload_v2_techniques_on",true));
      const [directionsEnabled,  setDirectionsEnabled]  = useState(()=>loadState("reload_v2_directions_on",true));
      const [responsesEnabled,   setResponsesEnabled]   = useState(()=>loadState("reload_v2_responses_on",true));
      const [privacyAcknowledged,setPrivacyAcknowledged] = useState(()=>loadState("reload_v2_privacy_seen",false));
      const [showResponseCard,   setShowResponseCard]   = useState(false);
      const [currentResponse,    setCurrentResponse]    = useState(null);
      const [lastNudgeDismissedAt,setLastNudgeDismissedAt] = useState(()=>loadState("reload_v2_last_nudge_dismissed_at",null));
      const [settingsOpen,       setSettingsOpen]       = useState(false);
      const [privacySheetOpen,   setPrivacySheetOpen]   = useState(false);
      const [weeklyOpen,         setWeeklyOpen]         = useState(false);
      const [calendarOpen,       setCalendarOpen]       = useState(false);
      const [calendarMonth,      setCalendarMonth]      = useState(()=>startOfMonth(new Date()));
      const [techniquesOpen,     setTechniquesOpen]     = useState(false);
      const [goalSheetOpen,      setGoalSheetOpen]      = useState(false);
      const [reminderManagerOpen,setReminderManagerOpen]= useState(false);
      const [reminderFormOpen,   setReminderFormOpen]   = useState(false);
      const [editingReminder,    setEditingReminder]    = useState(null);
      const [emotionManagerOpen, setEmotionManagerOpen] = useState(false);
      const [showCustomForm,     setShowCustomForm]     = useState(false);
      const [editingCustomEmotion,setEditingCustomEmotion] = useState(null);
      const [contextManagerOpen, setContextManagerOpen] = useState(false);
      const [showContextForm,    setShowContextForm]    = useState(false);
      const [editingCustomContext,setEditingCustomContext] = useState(null);
      const [showClearConfirm,   setShowClearConfirm]   = useState(false);
      const [toast,              setToast]              = useState(null);
      const [logAnimating,       setLogAnimating]       = useState(false);
      const [poppingId,          setPoppingId]          = useState(null);
      const poppingTimerRef = useRef(null);
      useEffect(()=>()=>{ if(poppingTimerRef.current) clearTimeout(poppingTimerRef.current); },[]);
      const [showTechPrompt,     setShowTechPrompt]     = useState(false);
      const [promptEmotionId,    setPromptEmotionId]    = useState("");
      const [promptTechniqueSeed,setPromptTechniqueSeed] = useState("initial");
      const [currentDayKey,      setCurrentDayKey]      = useState(()=>getTodayKey());

      const emotionMap = useMemo(()=>({
        ...BASE_EMOTION_MAP,
        ...Object.fromEntries(customEmotions.map(e=>[e.id,e])),
      }),[customEmotions]);

      const visibleCustomEmotions = useMemo(()=>customEmotions.filter(e=>!e.archived),[customEmotions]);
      const visibleCustomContexts = useMemo(()=>customContexts.filter(item=>!item.archived),[customContexts]);
      const allEmotions = useMemo(()=>[...EMOTIONS,...customEmotions],[customEmotions]);
      const visibleEmotions = useMemo(()=>[...EMOTIONS,...visibleCustomEmotions],[visibleCustomEmotions]);
      const contextOptions = useMemo(()=>[...CONTEXT_OPTIONS, ...visibleCustomContexts.map(item=>item.label)], [visibleCustomContexts]);

      // Each slice has its own useEffect writer. On multi-slice mutations (e.g. clearPrototypeData)
      // this fires ~7 synchronous writes in one tick. Acceptable for now; revisit if beta shows
      // main-thread jank on low-end devices — the fix is a single debounced useReducer persistence layer.
      useEffect(()=>saveState("reload_v2_entries",entries),                   [entries]);
      useEffect(()=>saveState("reload_v2_composer",composer),                 [composer]);
      useEffect(()=>saveState("reload_v2_custom_emotions",customEmotions),    [customEmotions]);
      useEffect(()=>saveState("reload_v2_custom_contexts",customContexts),    [customContexts]);
      useEffect(()=>saveState("reload_v2_goal",moodGoal),                     [moodGoal]);
      useEffect(()=>saveState("reload_v2_reminders",reminders),               [reminders]);
      useEffect(()=>saveState("reload_v2_saved_techs",savedTechniques),       [savedTechniques]);
      useEffect(()=>saveState("reload_v2_techniques_on",techniquesEnabled),   [techniquesEnabled]);
      useEffect(()=>saveState("reload_v2_directions_on",directionsEnabled),   [directionsEnabled]);
      useEffect(()=>saveState("reload_v2_responses_on",responsesEnabled),     [responsesEnabled]);
      useEffect(()=>saveState("reload_v2_privacy_seen",privacyAcknowledged),  [privacyAcknowledged]);
      useEffect(()=>saveState("reload_v2_last_nudge_dismissed_at",lastNudgeDismissedAt), [lastNudgeDismissedAt]);
      useEffect(()=>{ if(!toast)return; const t=setTimeout(()=>setToast(null),2200); return()=>clearTimeout(t); },[toast]);

      useEffect(()=>{
        const timer = setInterval(()=>{
          const nextKey = getTodayKey();
          setCurrentDayKey(current=>current===nextKey ? current : nextKey);
        }, 60000);
        return ()=>clearInterval(timer);
      },[]);

      useEffect(()=>{
        function surfaceDueReminders() {
          const now = Date.now();
          const dueReminders = reminders.filter(reminder => !reminder.deliveredAt && reminder.scheduledFor <= now);
          if (!dueReminders.length) return;
          const nextReminder = dueReminders[0];
          setToast({
            title: nextReminder.label,
            body: nextReminder.message,
          });
          if (typeof Notification !== "undefined" && Notification.permission === "granted") {
            try {
              new Notification(nextReminder.label, { body: nextReminder.message });
            } catch {}
          }
          setReminders(current => current.map(reminder => (
            !reminder.deliveredAt && reminder.scheduledFor <= now
              ? { ...reminder, deliveredAt: now, updatedAt: now }
              : reminder
          )));
        }

        surfaceDueReminders();
        const timer = setInterval(surfaceDueReminders, 30000);
        return ()=>clearInterval(timer);
      },[reminders]);

      // P3T9 CHANGE: cache date labels and heavier analytics so they only recalculate when the underlying data changes.
      const headerDateLabel = useMemo(()=>formatHeaderDate(new Date(currentDayKey)), [currentDayKey]);
      const todayKey        = currentDayKey;
      const todayEntries    = useMemo(()=>getEntriesForDay(entries,todayKey), [entries,todayKey]);
      const lastEntry       = useMemo(()=>getLastEntry(entries), [entries]);
      const lastEmotion     = useMemo(()=>lastEntry?emotionMap[lastEntry.emotionId]??null:null, [lastEntry,emotionMap]);
      const streak          = useMemo(()=>computeStreak(entries), [entries]);
      const weeklySummary   = useMemo(()=>getWeeklySummary(entries,emotionMap), [entries,emotionMap]);
      const insights        = useMemo(()=>buildInsights(entries,emotionMap), [entries,emotionMap]);
      const smartNudge      = useMemo(()=>buildSmartNudge(todayEntries,emotionMap,lastNudgeDismissedAt), [todayEntries,emotionMap,lastNudgeDismissedAt]);
      const selectedEmotion = composer.emotionId?emotionMap[composer.emotionId]:null;
      const goalReminders   = useMemo(()=>(
        moodGoal ? reminders.filter(reminder => reminder.goalId === moodGoal.id) : []
      ), [reminders, moodGoal]);

      // Both selectedEmotion and lastEmotion are nullable; && short-circuits safely.
      // Verify under React Strict Mode — double-invoke will expose any hidden dereference.
      const ambientEmotion = useMemo(()=>{
        if(selectedEmotion&&getEmotionTrackingIds(selectedEmotion).some(id=>VIVID_IDS.has(id)))return selectedEmotion;
        if(lastEmotion&&getEmotionTrackingIds(lastEmotion).some(id=>VIVID_IDS.has(id)))return lastEmotion;
        return BASE_EMOTION_MAP["deep-calm"];
      },[selectedEmotion,lastEmotion]);

      function updateComposer(field,value){ setComposer(c=>({...c,[field]:value})); }
      function resetComposer(){ setComposer({emotionId:"",intensity:3,place:"",contexts:[],note:""}); }

      function handleEmotionSelect(id){
        if(poppingTimerRef.current) clearTimeout(poppingTimerRef.current);
        setPoppingId(id);
        poppingTimerRef.current = setTimeout(()=>setPoppingId(null),320);
        updateComposer("emotionId",id);
      }

      function saveEntry(){
        if(!composer.emotionId)return;
        const emotion = emotionMap[composer.emotionId];
        // Guard: emotionId in composer could reference a custom emotion that was later deleted.
        // Reset and bail rather than crashing on emotion.label below.
        if(!emotion){ resetComposer(); return; }
        // Strip RTL override characters to prevent timeline rendering breakage.
        const sanitizedNote = composer.note.trim().replace(/[\u202A-\u202E\u2066-\u2069]/g, "");
        const entry = { id:createId("entry"), emotionId:composer.emotionId, intensity:composer.intensity, place:composer.place, contexts:composer.contexts, note:sanitizedNote, ts:Date.now() };
        const nextStreak = computeStreak([...entries, entry], entry.ts);
        setLogAnimating(true); setTimeout(()=>setLogAnimating(false),500);
        // P3T8 CHANGE: rely on React 18 automatic batching instead of splitting urgent and non-urgent updates.
        setEntries(current=>[...current, entry]);
        setToast({ title:nextStreak.count>1?`🔥 ${nextStreak.count} days in a row`:"Check-in saved", body:composer.place?`${emotion.label} logged at ${composer.place}.`:`${emotion.label} logged for today.` });
        setPromptEmotionId(composer.emotionId);
        setPromptTechniqueSeed(entry.id);
        if(responsesEnabled){
          const response = getBehaviouralResponse(emotion, entry.intensity, entry.ts, entry.contexts, entries.length);
          setCurrentResponse(response);
          setShowResponseCard(true);
        }
        if(techniquesEnabled) setShowTechPrompt(true);
        resetComposer();
      }

      function dismissSmartNudge(){
        setLastNudgeDismissedAt(Date.now());
      }

      function saveCustomEmotion(newEmotion){
        setCustomEmotions(current=>{
          const exists = current.some(emotion=>emotion.id===newEmotion.id);
          return exists
            ? current.map(emotion=>emotion.id===newEmotion.id ? { ...newEmotion, archived:false } : emotion)
            : [...current, { ...newEmotion, archived:false }];
        });
        setEmotionManagerOpen(true);
        setEditingCustomEmotion(null);
        setShowCustomForm(false);
        setToast({ title:editingCustomEmotion?"Feeling updated":"Feeling added", body:editingCustomEmotion?`"${newEmotion.label}" has been refreshed.`:`"${newEmotion.label}" is now in your list.` });
      }

      // P3T3 CHANGE: custom emotions can now be edited or softly removed without breaking past logs.
      function editCustomEmotion(emotion){
        setEmotionManagerOpen(false);
        setEditingCustomEmotion(emotion);
        setShowCustomForm(true);
      }

      function deleteCustomEmotion(emotionId){
        const target = customEmotions.find(emotion=>emotion.id===emotionId);
        setCustomEmotions(current=>current.map(emotion=>emotion.id===emotionId ? { ...emotion, archived:true } : emotion));
        if (composer.emotionId === emotionId) resetComposer();
        setToast({ title:"Feeling removed", body:target?`"${target.label}" won't show in your active list anymore.`:"Your feeling was removed." });
      }

      function saveMoodGoal(goal){
        setMoodGoal(goal);
        setGoalSheetOpen(false);
        const opt = GOAL_OPTIONS.find(g=>g.id===goal.id);
        setToast({ title:"Direction set", body:`${opt?.label} — this ${goal.period}.` });
      }

      function clearMoodGoal(){
        setMoodGoal(null);
        setGoalSheetOpen(false);
        setToast({ title:"Direction cleared", body:"You can always set a new one." });
      }

      function handleToggleSaveTechnique(techId){
        setSavedTechniques(s=>s.includes(techId)?s.filter(id=>id!==techId):[...s,techId]);
      }

      function openReminderManager(){
        setReminderManagerOpen(true);
      }

      function startAddingReminder(){
        if (!moodGoal) return;
        setEditingReminder(buildDefaultReminder(moodGoal.id));
        setReminderManagerOpen(false);
        setReminderFormOpen(true);
      }

      function startEditingReminder(reminder){
        setEditingReminder(reminder);
        setReminderManagerOpen(false);
        setReminderFormOpen(true);
      }

      function saveReminder(reminder){
        const isEditingReminder = reminders.some(item => item.id === reminder.id);
        setReminders(current => {
          const exists = current.some(item => item.id === reminder.id);
          return exists
            ? current.map(item => item.id === reminder.id ? reminder : item)
            : [...current, reminder];
        });
        setReminderFormOpen(false);
        setReminderManagerOpen(true);
        setEditingReminder(null);
        setToast({
          title: isEditingReminder ? "Reminder updated" : "Reminder added",
          body: `${reminder.label} is set for ${formatReminderDateTime(reminder.scheduledFor)}.`,
        });
      }

      function deleteReminder(reminderId){
        const target = reminders.find(reminder => reminder.id === reminderId);
        setReminders(current => current.filter(reminder => reminder.id !== reminderId));
        setToast({
          title:"Reminder deleted",
          body: target ? `Removed ${target.label}.` : "That reminder was removed.",
        });
      }

      function toggleTechniques(){
        setTechniquesEnabled(v=>!v);
        setShowTechPrompt(false);
      }

      function toggleResponses(){
        setResponsesEnabled(v=>!v);
        setShowResponseCard(false);
      }

      function toggleDirections(){
        setDirectionsEnabled(current=>{
          const next = !current;
          if (!next) setGoalSheetOpen(false);
          return next;
        });
      }

      function handleOpenPrivacySheet(){
        setSettingsOpen(false);
        setPrivacySheetOpen(true);
      }

      function handleAcknowledgePrivacy(){
        setPrivacyAcknowledged(true);
      }

      // P3T5 CHANGE: custom “what’s going on?” labels now persist and can be managed like custom emotions.
      function saveCustomContext(item){
        const normalizedLabel = item.label.trim();
        const builtInDuplicate = CONTEXT_OPTIONS.some(label => label.toLowerCase() === normalizedLabel.toLowerCase());
        const duplicate = customContexts.find(existing => existing.id !== item.id && existing.label.toLowerCase() === normalizedLabel.toLowerCase() && !existing.archived);
        if (builtInDuplicate || duplicate) {
          setToast({ title:"That activity already exists", body:"Try a slightly different label so it stays easy to spot later." });
          return;
        }
        const previous = customContexts.find(existing => existing.id === item.id);
        setCustomContexts(current=>{
          const exists = current.some(existing=>existing.id===item.id);
          const nextItem = { ...item, label:normalizedLabel, archived:false };
          return exists
            ? current.map(existing=>existing.id===item.id ? nextItem : existing)
            : [...current, nextItem];
        });
        if (previous && previous.label !== normalizedLabel) {
          setComposer(current=>({ ...current, contexts: current.contexts.map(ctx => ctx === previous.label ? normalizedLabel : ctx) }));
        }
        setEditingCustomContext(null);
        setShowContextForm(false);
        setContextManagerOpen(true);
        setToast({ title:previous ? "Activity updated" : "Activity added", body:previous ? `“${normalizedLabel}” is ready for future check-ins.` : `“${normalizedLabel}” is now part of your activity list.` });
      }

      function editCustomContext(item){
        setContextManagerOpen(false);
        setEditingCustomContext(item);
        setShowContextForm(true);
      }

      function deleteCustomContext(itemId){
        const target = customContexts.find(item=>item.id===itemId);
        setCustomContexts(current=>current.map(item=>item.id===itemId ? { ...item, archived:true } : item));
        if (target) setComposer(current=>({ ...current, contexts: current.contexts.filter(ctx => ctx !== target.label) }));
        setToast({ title:"Activity removed", body:target ? `“${target.label}” will stay out of the list from now on.` : "That activity was removed." });
      }

      function clearPrototypeData(){
        // Data
        setEntries([]); setCustomEmotions([]); setCustomContexts([]);
        setMoodGoal(null); setReminders([]); setSavedTechniques([]); setLastNudgeDismissedAt(null);
        // Settings — restore ALL to defaults
        setTechniquesEnabled(true); setDirectionsEnabled(true); setResponsesEnabled(true);
        setPrivacyAcknowledged(false);
        // UI — close every sheet and prompt so nothing floats over an empty state
        setEmotionManagerOpen(false); setShowCustomForm(false); setEditingCustomEmotion(null);
        setContextManagerOpen(false); setShowContextForm(false); setEditingCustomContext(null);
        setCalendarOpen(false); setWeeklyOpen(false); setGoalSheetOpen(false);
        setReminderManagerOpen(false); setReminderFormOpen(false); setEditingReminder(null);
        setTechniquesOpen(false); setSettingsOpen(false); setPrivacySheetOpen(false); setShowClearConfirm(false);
        setShowTechPrompt(false); setPromptEmotionId(""); setLogAnimating(false);
        setShowResponseCard(false); setCurrentResponse(null);
        resetComposer();
        setToast({ title:"All clear", body:"Your data has been cleared." });
      }

      const noteLen = composer.note.length;
      const showNoteCounter = noteLen >= 120;

      return (
        <EmotionMapContext.Provider value={emotionMap}>
          <div style={{ minHeight:"100vh", background:"linear-gradient(180deg,#F2F5FB 0%,#F8FAFE 30%,#F1F5FA 100%)", color:"#0F1728", fontFamily:'"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif', position:"relative", overflow:"hidden" }}>

            {/* SVG gradient defs */}
            <svg width="0" height="0" style={{ position:"absolute", overflow:"hidden" }} aria-hidden="true">
              <defs>
                {allEmotions.map(e=>(
                  <linearGradient key={e.id} id={`flame-grad-${e.id}`} x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stopColor={e.gradientTop} />
                    <stop offset="100%" stopColor={e.gradientBottom} />
                  </linearGradient>
                ))}
              </defs>
            </svg>

            <style>{`
              :root{--header-h:128px}
              *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
              body{margin:0}
              button,input,textarea{font:inherit}
              textarea::placeholder,input::placeholder{color:#8A94A6}
              .reload-scroll{min-height:100vh;overflow-y:auto;position:relative;z-index:1}
              .reload-emotion{transition:transform 200ms ease,box-shadow 200ms ease,background 200ms ease}
              @media (hover:hover){
                .reload-chip:hover{transform:translateY(-1px)}
                .reload-emotion:hover{transform:translateY(-2px) scale(1.01)}
              }
              .reload-emotion-pop{animation:reload-select-pop 300ms cubic-bezier(0.34,1.56,0.64,1) both}
              :focus-visible{outline:2px solid #4D96FF;outline-offset:2px;border-radius:4px}
              @keyframes reload-select-pop{0%{transform:scale(1)}40%{transform:scale(0.94)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
              @keyframes reload-toast-in{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
              @keyframes reload-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
              @keyframes reload-flame-rising{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.08)}}
              @keyframes reload-flame-stable{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
              @keyframes reload-flame-fading{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(0.92);opacity:0.85}}
              @keyframes reload-flame-log{0%{transform:scale(0.9)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
              @keyframes reload-streak-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,150,50,0.4)}50%{box-shadow:0 0 0 6px rgba(255,150,50,0)}}
              @media (max-width:319px){.reload-emotion-grid{grid-template-columns:1fr!important}}
              @media (prefers-reduced-motion:reduce){
                *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
              }
              @media (prefers-reduced-transparency:reduce){
                .reload-card-glass{background:rgba(255,255,255,0.98)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
                .reload-header-glass{background:rgba(242,245,251,0.99)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
              }
            `}</style>

            {/* Ambient bg */}
            <div style={{ position:"absolute", inset:0, pointerEvents:"none", background:`radial-gradient(circle at 15% 12%,${ambientEmotion.glow} 0%,rgba(255,255,255,0) 28%),radial-gradient(circle at 85% 8%,rgba(255,255,255,0.85) 0%,rgba(255,255,255,0) 24%),radial-gradient(circle at 70% 28%,${ambientEmotion.tint} 0%,rgba(255,255,255,0) 30%)`, transition:"all 600ms ease" }} aria-hidden="true" />

            <div className="reload-scroll">
              <div style={{ maxWidth:460, margin:"0 auto", padding:"18px 16px", paddingBottom:"max(40px,env(safe-area-inset-bottom))" }}>

                {/* ── Header ── */}
                <header style={{ position:"sticky", top:0, zIndex:20, padding:"8px 0 16px", background:"linear-gradient(180deg,rgba(242,245,251,0.97),rgba(242,245,251,0.72),rgba(242,245,251,0))", backdropFilter:"blur(18px)", WebkitBackdropFilter:"blur(18px)" }} className="reload-header-glass">
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:16 }}>
                    <div>
                      <div style={{ fontSize:12, color:"#6B7688", fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:6 }}>Reload</div>
                      <h1 style={{ margin:0, fontSize:32, lineHeight:1, letterSpacing:"-0.06em", fontWeight:700 }}>How are you doing?</h1>
                      <p style={{ margin:"8px 0 0", fontSize:14, color:"#5A6679", letterSpacing:"-0.01em" }}>{headerDateLabel}</p>
                    </div>
                    <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:8 }}>
                      {streak.count>0 && (
                        <div aria-label={`${streak.count} day streak`} style={{ display:"flex", alignItems:"center", gap:5, padding:"5px 11px", borderRadius:999, background:"rgba(255,150,50,0.12)", border:"1px solid rgba(255,150,50,0.28)", fontSize:12, fontWeight:700, color:"#D06000", animation:"reload-streak-pulse 2s ease-in-out infinite" }}>
                          🔥 {streak.count} day{streak.count!==1?"s":""}
                        </div>
                      )}
                      <div style={{ display:"flex", gap:8 }}>
                        <button aria-label="Things you can try" onClick={()=>setTechniquesOpen(true)} style={{ width:44, height:44, borderRadius:"50%", border:"1px solid rgba(255,255,255,0.8)", background:"rgba(255,255,255,0.74)", boxShadow:"0 10px 22px rgba(15,23,42,0.08)", cursor:"pointer", color:"#0F1728", fontSize:16 }}>✦</button>
                        <button aria-label="Settings" onClick={()=>setSettingsOpen(true)} style={{ width:44, height:44, borderRadius:"50%", border:"1px solid rgba(255,255,255,0.8)", background:"rgba(255,255,255,0.74)", boxShadow:"0 10px 22px rgba(15,23,42,0.08)", cursor:"pointer", color:"#0F1728", fontSize:18, fontWeight:600 }}>···</button>
                      </div>
                    </div>
                  </div>
                </header>

                {/* ── Today at a glance ── */}
                <SectionCard style={{ padding:22, marginBottom:18, animation:"reload-rise 420ms ease both" }}>
                  <div style={{ fontSize:12, color:"#7A869A", fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:8 }}>Today at a glance</div>
                  <div style={{ fontSize:22, fontWeight:700, letterSpacing:"-0.04em" }}>
                    {todayEntries.length ? `${todayEntries.length} check-in${todayEntries.length>1?"s":""} today` : "Nothing logged yet today"}
                  </div>
                  {todayEntries.length>0
                    ? <TodayEmotionStrip entries={todayEntries} />
                    : <p style={{ margin:"10px 0 0", color:"#617083", fontSize:14, lineHeight:1.6, letterSpacing:"-0.01em" }}>Tap any feeling below to make your first check-in. No pressure.</p>}
                </SectionCard>

                {/* ── Quick capture ── */}
                {/* top uses --header-h so sticky offset stays correct if header padding ever changes. */}
                <div style={{ position:"sticky", top:"var(--header-h, 128px)", zIndex:18, marginBottom:22 }}>
                  <SectionCard style={{ padding:22 }}>
                    <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, marginBottom:18 }}>
                      <div>
                        <div style={{ fontSize:12, color:"#7A869A", fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:6 }}>Quick capture</div>
                        <div style={{ fontSize:22, fontWeight:700, letterSpacing:"-0.05em" }}>How are you holding up right now?</div>
                      </div>
                      <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:8, flexShrink:0 }}>
                        <div style={{ borderRadius:999, padding:"7px 12px", background:"rgba(242,245,249,0.92)", color:"#627085", fontSize:12, fontWeight:700 }}>Under 5s</div>
                        {/* P3T4 CHANGE: main selection screen now links to a dedicated emotion editor. */}
                        <button onClick={()=>setEmotionManagerOpen(true)} style={{ border:"none", borderRadius:999, background:"#EEF2F7", color:"#435065", padding:"8px 14px", minHeight:44, fontSize:12, fontWeight:700, cursor:"pointer" }}>Edit</button>
                      </div>
                    </div>

                    {/* Emotion grid */}
                    <div className="reload-emotion-grid" style={{ display:"grid", gridTemplateColumns:"repeat(2,minmax(0,1fr))", gap:10, marginBottom:14 }}>
                      {visibleEmotions.map(emotion=>{
                        const active  = composer.emotionId===emotion.id;
                        const popping = poppingId===emotion.id;
                        return (
                          <button key={emotion.id} onClick={()=>handleEmotionSelect(emotion.id)} aria-pressed={active} className={`reload-emotion${popping?" reload-emotion-pop":""}`} style={{ border:"none", borderRadius:22, padding:16, textAlign:"left", background:active?emotion.tint:"rgba(247,249,252,0.96)", boxShadow:active?`inset 0 0 0 1.5px ${emotion.color}66,0 14px 28px ${emotion.glow}`:"inset 0 0 0 1px rgba(216,224,235,0.7)", cursor:"pointer", minHeight:44 }}>
                            <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:10 }}>
                              <Flame emotion={emotion} intensity={active?composer.intensity:(emotion.id==="energized"?4:3)} size={emotion.id==="energized"?28:22} active={active} />
                              <span style={{ fontSize:15, fontWeight:700, color:"#0F1728", letterSpacing:"-0.03em" }}>{emotion.label}</span>
                            </div>
                            <div style={{ fontSize:11, color:"#667489", lineHeight:1.4 }}>{emotion.hint}</div>
                          </button>
                        );
                      })}
                    </div>

                    {/* Expanded composer */}
                    {selectedEmotion ? (
                      <div style={{ borderRadius:24, padding:18, background:"rgba(248,250,253,0.92)", boxShadow:"inset 0 0 0 1px rgba(220,227,237,0.66)", animation:"reload-rise 220ms ease both" }}>
                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, marginBottom:16 }}>
                          <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                            <Flame emotion={selectedEmotion} intensity={composer.intensity} size={28} active animating={logAnimating} />
                            <div>
                              <div style={{ fontSize:16, fontWeight:700, color:"#0F1728", letterSpacing:"-0.03em" }}>{selectedEmotion.label}</div>
                              <div style={{ fontSize:12, color:"#67758A" }}>{selectedEmotion.hint}</div>
                            </div>
                          </div>
                          <button onClick={resetComposer} style={{ border:"none", borderRadius:999, background:"#EBF0F5", color:"#58677C", padding:"8px 12px", minHeight:44, fontSize:12, fontWeight:700, cursor:"pointer" }}>Reset</button>
                        </div>

                        <div style={{ marginBottom:16 }}>
                          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                            <label htmlFor="intensity-slider" style={{ fontSize:13, fontWeight:700, color:"#435065" }}>Intensity</label>
                            <span style={{ fontSize:13, color:"#67758A", fontWeight:600 }}>{INTENSITY_LABELS[composer.intensity-1]}</span>
                          </div>
                          {/* accentColor works on Chrome/Safari/Firefox 92+. No-op on iOS Safari <14.5 — acceptable; add a CSS fallback if that cohort matters at launch. */}
                          <input id="intensity-slider" type="range" min={1} max={5} value={composer.intensity} onChange={e=>updateComposer("intensity",Number(e.target.value))} aria-valuetext={INTENSITY_LABELS[composer.intensity-1]} style={{ width:"100%", accentColor:selectedEmotion.color }} />
                        </div>

                        <div style={{ marginBottom:16 }}>
                          <div style={{ fontSize:13, fontWeight:700, color:"#435065", marginBottom:10 }}>Where are you?</div>
                          <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                            {PLACE_OPTIONS.map(p=>(
                              <TagPill key={p} label={p} active={composer.place===p} accent={selectedEmotion.tint} onClick={()=>updateComposer("place",composer.place===p?"":p)} />
                            ))}
                          </div>
                        </div>

                        <div style={{ marginBottom:16 }}>
                          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, marginBottom:10 }}>
                            <div style={{ fontSize:13, fontWeight:700, color:"#435065" }}>What's going on?</div>
                            <button onClick={()=>setContextManagerOpen(true)} style={{ border:"none", borderRadius:999, background:"#EEF2F7", color:"#435065", padding:"8px 12px", minHeight:36, fontSize:12, fontWeight:700, cursor:"pointer", flexShrink:0 }}>Edit list</button>
                          </div>
                          <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                            {contextOptions.map(c=>(
                              <TagPill key={c} label={c} active={composer.contexts.includes(c)} accent={selectedEmotion.tint} onClick={()=>updateComposer("contexts",toggleValue(composer.contexts,c))} />
                            ))}
                          </div>
                        </div>

                        <div style={{ marginBottom:18 }}>
                          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                            <label htmlFor="note-field" style={{ fontSize:13, fontWeight:700, color:"#435065" }}>Anything else?</label>
                            {showNoteCounter && <span style={{ fontSize:12, color: noteLen>=135?"#FF3B3F":"#7A869A", fontWeight:600 }} aria-live="polite">{140-noteLen} left</span>}
                          </div>
                          <textarea id="note-field" rows={3} maxLength={140} value={composer.note} onChange={e=>updateComposer("note",e.target.value.slice(0,140))} placeholder="What's on your mind? (optional)" style={{ width:"100%", border:"none", borderRadius:18, padding:"14px 16px", background:"#fff", boxShadow:"inset 0 0 0 1px rgba(216,224,235,0.9)", color:"#0F1728", resize:"none", lineHeight:1.6, outline:"none" }} />
                        </div>

                        <button
                          onClick={saveEntry}
                          style={{ width:"100%", border:"none", borderRadius:20, padding:"16px 18px", minHeight:44, background:`linear-gradient(135deg,${selectedEmotion.gradientTop},${selectedEmotion.gradientBottom})`, color:"#0F1728", fontSize:15, fontWeight:800, letterSpacing:"-0.02em", cursor:"pointer", boxShadow:`0 18px 34px ${selectedEmotion.glow}` }}
                          onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-1px)"}}
                          onMouseLeave={e=>{e.currentTarget.style.transform=""}}
                        >
                          {composer.place||composer.contexts.length||composer.note.trim()?"Save check-in":"Log now"}
                        </button>
                      </div>
                    ) : null}
                  </SectionCard>
                </div>

                {/* ── Smart response card (shown before technique prompt) ── */}
                {responsesEnabled && showResponseCard && currentResponse && (
                  <ResponseCard
                    response={currentResponse}
                    emotion={promptEmotionId ? emotionMap[promptEmotionId] : null}
                    onDismiss={()=>setShowResponseCard(false)}
                  />
                )}

                {/* ── Techniques entry + post-log prompt ── */}
                {techniquesEnabled && (
                  <button
                    onClick={()=>setTechniquesOpen(true)}
                    className="reload-chip"
                    style={{ width:"100%", border:"1.5px dashed rgba(180,190,210,0.6)", borderRadius:18, padding:"13px 16px", minHeight:44, background:"rgba(247,249,252,0.6)", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"space-between", gap:8, fontSize:13, fontWeight:600, color:"#7A869A", marginBottom:showTechPrompt?14:22 }}
                  >
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <span style={{ fontSize:15 }} aria-hidden="true">✦</span>
                      <span>Try a technique</span>
                    </div>
                    <span style={{ fontSize:12, fontWeight:700, color:"#9AA5B4" }}>Optional</span>
                  </button>
                )}

                {techniquesEnabled && showTechPrompt && promptEmotionId && (
                  <TechniquePrompt
                    emotionId={promptEmotionId}
                    goalId={directionsEnabled ? moodGoal?.id : null}
                    promptSeed={promptTechniqueSeed}
                    savedTechniques={savedTechniques}
                    onToggleSave={handleToggleSaveTechnique}
                    onOpenHub={()=>{ setTechniquesOpen(true); setShowTechPrompt(false); }}
                    onDismiss={()=>setShowTechPrompt(false)}
                  />
                )}

                {/* ── Today timeline ── */}
                <TodayTimelineSection entries={todayEntries} />

                {/* ── Pattern insights ── */}
                <section style={{ marginBottom:22 }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
                    <h2 style={{ margin:0, fontSize:24, fontWeight:700, letterSpacing:"-0.05em" }}>Your patterns</h2>
                    <span style={{ fontSize:13, color:"#64748B", fontWeight:700 }}>See your trends</span>
                  </div>
                  <div style={{ display:"grid", gap:12 }}>
                    {insights.length===0 ? (
                      <SectionCard style={{ padding:22 }}>
                        <p style={{ margin:0, fontSize:16, fontWeight:700, color:"#0F1728", letterSpacing:"-0.03em" }}>Your patterns will show up here</p>
                        <p style={{ margin:"8px 0 0", color:"#67758A", fontSize:14, lineHeight:1.7 }}>Log a few more moments with a place or context — we'll start spotting trends you can actually use.</p>
                      </SectionCard>
                    ) : insights.map((ins, index)=>(
                      <SectionCard key={ins.id || `${ins.title}-${index}`} style={{ padding:22 }}>
                        <div style={{ width:42, height:6, borderRadius:999, background:ins.accent, marginBottom:14 }} />
                        <p style={{ margin:0, fontSize:17, fontWeight:700, color:"#0F1728", letterSpacing:"-0.03em" }}>{ins.title}</p>
                        <p style={{ margin:"8px 0 0", color:"#67758A", fontSize:14, lineHeight:1.7 }}>{ins.body}</p>
                      </SectionCard>
                    ))}
                  </div>
                </section>

                {/* ── Smart nudge ── */}
                {smartNudge && (
                  <section style={{ marginBottom:22 }}>
                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
                      <h2 style={{ margin:0, fontSize:24, fontWeight:700, letterSpacing:"-0.05em" }}>Just for you</h2>
                      <span style={{ fontSize:13, color:"#64748B", fontWeight:700 }}>Right now</span>
                    </div>
                    <SectionCard style={{ padding:22 }}>
                      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, marginBottom:16 }}>
                        <div style={{ display:"inline-flex", alignItems:"center", gap:10, borderRadius:999, padding:"10px 12px", background:"rgba(244,247,251,0.92)" }}>
                          <div style={{ width:10, height:10, borderRadius:"50%", background:smartNudge.accent }} />
                          <span style={{ fontSize:12, color:"#627085", fontWeight:700 }}>Based on your day</span>
                        </div>
                        <button onClick={dismissSmartNudge} style={{ border:"none", background:"none", cursor:"pointer", color:"#9AA5B4", fontSize:16, padding:4, lineHeight:1, minHeight:28 }} aria-label="Dismiss nudge">✕</button>
                      </div>
                      <p style={{ margin:0, fontSize:17, fontWeight:700, color:"#0F1728", letterSpacing:"-0.03em" }}>{smartNudge.title}</p>
                      <p style={{ margin:"8px 0 0", color:"#67758A", fontSize:14, lineHeight:1.7 }}>{smartNudge.body}</p>
                    </SectionCard>
                  </section>
                )}

                {/* P3T5 CHANGE: direction section now respects a settings toggle and softly pops in when enabled. */}
                {directionsEnabled && (
                  <section style={{ marginBottom:22, animation:"reload-rise 220ms ease both" }}>
                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
                      <h2 style={{ margin:0, fontSize:24, fontWeight:700, letterSpacing:"-0.05em" }}>Your direction</h2>
                      {moodGoal && <span style={{ fontSize:13, color:"#64748B", fontWeight:700 }}>Active</span>}
                    </div>
                    <GoalCard
                      goal={moodGoal}
                      entries={entries}
                      reminders={goalReminders}
                      onEdit={()=>setGoalSheetOpen(true)}
                      onOpenTechniques={()=>setTechniquesOpen(true)}
                      onOpenReminders={openReminderManager}
                    />
                  </section>
                )}

                {/* P3T5 CHANGE: monthly now opens as a dedicated calendar popup instead of an inline strip. */}
                <section>
                  <SectionCard style={{ padding:22 }}>
                      <button aria-expanded={weeklyOpen} onClick={()=>setWeeklyOpen(o=>!o)} style={{ width:"100%", border:"none", background:"none", padding:0, textAlign:"left", cursor:"pointer" }}>
                      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, marginBottom:weeklyOpen?18:0, width:"100%" }}>
                        <div>
                          <div style={{ fontSize:12, color:"#7A869A", fontWeight:700, letterSpacing:"0.08em", textTransform:"uppercase", marginBottom:6 }}>This week</div>
                          <div style={{ fontSize:24, fontWeight:700, letterSpacing:"-0.05em" }}>{weeklySummary.checkedDays}/7 days checked in</div>
                        </div>
                        <div aria-hidden="true" style={{ width:42, height:42, borderRadius:"50%", background:"rgba(244,247,251,0.92)", display:"grid", placeItems:"center", color:"#0F1728", fontSize:18, transform:weeklyOpen?"rotate(45deg)":"rotate(0deg)", transition:"transform 200ms ease" }}>+</div>
                      </div>
                      </button>

                    {weeklyOpen && (
                        <div style={{ animation:"reload-rise 240ms ease both" }}>
                          <div style={{ display:"flex", gap:8, marginBottom:18, flexWrap:"wrap" }}>
                            <div style={{ borderRadius:999, padding:"8px 14px", minHeight:36, background:"#0F1728", color:"#fff", fontSize:12, fontWeight:700, display:"inline-flex", alignItems:"center" }}>Weekly</div>
                            <button
                              type="button"
                              onClick={e=>{ e.stopPropagation(); setCalendarMonth(startOfMonth(new Date())); setCalendarOpen(true); }}
                              style={{ border:"none", borderRadius:999, padding:"8px 14px", minHeight:36, background:"#EEF2F7", color:"#435065", fontSize:12, fontWeight:700, cursor:"pointer" }}
                            >
                              Monthly
                            </button>
                          </div>

                          <div style={{ display:"grid", gridTemplateColumns:"repeat(7,minmax(0,1fr))", gap:10, marginBottom:20 }}>
                            {weeklySummary.rows.map((row,i)=>(
                              <div key={row.dayKey} style={{ textAlign:"center" }}>
                                <div style={{ height:74, display:"flex", alignItems:"flex-end", justifyContent:"center", marginBottom:8 }}>
                                  <WeeklyDayBar row={row} />
                                </div>
                                <div style={{ fontSize:12, color:"#6B7688", fontWeight:i===6?700:600 }}>{DAY_LABELS[i]}</div>
                              </div>
                            ))}
                          </div>

                          {weeklySummary.totalEntries>0 && (()=>{
                            const ids = new Set(weeklySummary.rows.flatMap(r=>r.entries.map(e=>e.emotionId)));
                            const ems = [...ids].map(id=>emotionMap[id]).filter(Boolean).slice(0,6);
                            if(ems.length<2)return null;
                            return (
                              <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:16 }}>
                                {ems.map(em=>(
                                  <div key={em.id} style={{ display:"flex", alignItems:"center", gap:4, padding:"3px 8px", borderRadius:999, background:em.tint, fontSize:10, fontWeight:700, color:"#223044" }}>
                                    <div style={{ width:6, height:6, borderRadius:"50%", background:em.color, flexShrink:0 }} />
                                    {em.label}
                                  </div>
                                ))}
                              </div>
                            );
                          })()}

                          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,minmax(0,1fr))", gap:10 }}>
                            {[{label:"Check-ins",value:weeklySummary.totalEntries},{label:"Most felt",value:weeklySummary.topEmotion?.label??"None"},{label:"Most logged from",value:weeklySummary.topPlace??"None"}].map(s=>(
                              <div key={s.label} style={{ borderRadius:22, padding:16, background:"rgba(248,250,253,0.92)", boxShadow:"inset 0 0 0 1px rgba(220,227,237,0.66)" }}>
                                <div style={{ fontSize:12, color:"#7A869A", fontWeight:700, marginBottom:8 }}>{s.label}</div>
                                <div style={{ fontSize:s.label==="Check-ins"?24:16, fontWeight:700, letterSpacing:s.label==="Check-ins"?"-0.05em":"-0.03em" }}>{s.value}</div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                  </SectionCard>
                </section>

              </div>
            </div>

            {settingsOpen && !showClearConfirm && (
              <SettingsSheet
                onClose={()=>setSettingsOpen(false)}
                onReset={()=>setShowClearConfirm(true)}
                onOpenPrivacy={handleOpenPrivacySheet}
                techniquesEnabled={techniquesEnabled}
                onToggleTechniques={toggleTechniques}
                directionsEnabled={directionsEnabled}
                onToggleDirections={toggleDirections}
                responsesEnabled={responsesEnabled}
                onToggleResponses={toggleResponses}
              />
            )}
            {privacySheetOpen && (
              <PrivacySheet onClose={()=>setPrivacySheetOpen(false)} />
            )}
            {!privacyAcknowledged && !showClearConfirm && !privacySheetOpen && !settingsOpen && (
              <WelcomePrivacySheet onContinue={handleAcknowledgePrivacy} />
            )}
            {showClearConfirm && (
              <ConfirmDialog
                title="Start fresh?"
                body="This removes all your check-ins, custom feelings, custom activities, saved techniques, your streak, and direction. It can't be undone."
                confirmLabel="Yes, clear it"
                onConfirm={clearPrototypeData}
                onCancel={()=>setShowClearConfirm(false)}
              />
            )}
            {reminderManagerOpen && moodGoal && (
              <ReminderManagerSheet
                goalOption={GOAL_OPTIONS.find(goal => goal.id === moodGoal.id)}
                reminders={goalReminders}
                onAdd={startAddingReminder}
                onEdit={startEditingReminder}
                onDelete={deleteReminder}
                onClose={()=>setReminderManagerOpen(false)}
              />
            )}
            {reminderFormOpen && moodGoal && editingReminder && (
              <ReminderFormSheet
                goalOption={GOAL_OPTIONS.find(goal => goal.id === moodGoal.id)}
                initialReminder={editingReminder}
                onSave={saveReminder}
                onClose={()=>{ setReminderFormOpen(false); setReminderManagerOpen(true); setEditingReminder(null); }}
              />
            )}
            {emotionManagerOpen && (
              <EmotionManagerSheet
                builtInEmotions={EMOTIONS}
                customEmotions={visibleCustomEmotions}
                onAdd={()=>{ setEmotionManagerOpen(false); setEditingCustomEmotion(null); setShowCustomForm(true); }}
                onEdit={editCustomEmotion}
                onDelete={deleteCustomEmotion}
                onClose={()=>setEmotionManagerOpen(false)}
              />
            )}
            {showCustomForm    && <CustomEmotionForm onSave={saveCustomEmotion} onClose={()=>{ setShowCustomForm(false); setEditingCustomEmotion(null); setEmotionManagerOpen(true); }} initialEmotion={editingCustomEmotion} />}
            {contextManagerOpen && (
              <ContextManagerSheet
                customContexts={visibleCustomContexts}
                onAdd={()=>{ setContextManagerOpen(false); setEditingCustomContext(null); setShowContextForm(true); }}
                onEdit={editCustomContext}
                onDelete={deleteCustomContext}
                onClose={()=>setContextManagerOpen(false)}
              />
            )}
            {showContextForm   && <CustomContextForm onSave={saveCustomContext} onClose={()=>{ setShowContextForm(false); setEditingCustomContext(null); setContextManagerOpen(true); }} initialItem={editingCustomContext} />}
            {calendarOpen      && (
              <MonthlyCalendarSheet
                entries={entries}
                emotionMap={emotionMap}
                monthDate={calendarMonth}
                todayKey={todayKey}
                onChangeMonth={offset=>setCalendarMonth(current=>shiftMonth(current, offset))}
                onClose={()=>setCalendarOpen(false)}
              />
            )}
            {techniquesOpen    && (
              <TechniquesSheet
                currentEmotionId={promptEmotionId || lastEntry?.emotionId || ""}
                goalId={directionsEnabled ? moodGoal?.id : null}
                savedTechniques={savedTechniques}
                onToggleSave={handleToggleSaveTechnique}
                onClose={()=>setTechniquesOpen(false)}
              />
            )}
            {directionsEnabled && goalSheetOpen && (
              <GoalSheet
                current={moodGoal}
                onSave={saveMoodGoal}
                onClear={clearMoodGoal}
                onClose={()=>setGoalSheetOpen(false)}
              />
            )}
            {toast             && <Toast toast={toast} />}
          </div>
        </EmotionMapContext.Provider>
      );
    }

    // ─── Mount ─────────────────────────────────────────────────────────────────

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
